<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Đăng ký | Web Basic</title>

        <!-- Bootstrap CSS đặt trước CSS tự viết. -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">

        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body class="bg-body-tertiary d-flex flex-column min-vh-100">
        <header class="bg-white border-bottom py-3">
            <div class="container">
                <!-- Có thể thay header này bằng Navbar chung của website. -->
                <a href="index.html" class="text-decoration-none fw-bold">
                    Web Basic — Về trang chủ
                </a>
            </div>
        </header>

        <!-- Bước 1: Canh giữa khung đăng ký bằng Flex và Grid của Bootstrap. -->
        <main class="container flex-grow-1 d-flex align-items-center py-5">
            <div class="row justify-content-center w-100 mx-0">
                <div class="col-12 col-md-8 col-lg-5">
                    <section class="card border-0 shadow-sm rounded-4"
                        aria-labelledby="register-title">
                        <div class="card-body p-4">
                            <h1 id="register-title"
                                class="h3 text-center mb-2">Đăng ký</h1>
                            <p class="text-secondary text-center mb-4">
                                Điền thông tin để thực hành tạo tài khoản.
                            </p>

                            <!-- Bước 2: Đặt các input bên trong form.
                 required: không được bỏ trống.
                 minlength: số ký tự tối thiểu.
                 novalidate: dùng phản hồi Bootstrap thay thông báo mặc định. -->
                            <form id="register-form" method="post"
                                class="needs-validation" novalidate>

                                <div class="mb-3">
                                    <label for="register-name"
                                        class="form-label">
                                        Họ và tên
                                    </label>
                                    <!-- id liên kết với label; name dùng khi gửi dữ liệu. -->
                                    <input
                                        type="text"
                                        id="register-name"
                                        name="fullName"
                                        class="form-control"
                                        placeholder="Nguyễn Văn An"
                                        autocomplete="name"
                                        minlength="2"
                                        aria-describedby="register-name-error"
                                        required>
                                    <div id="register-name-error"
                                        class="invalid-feedback">
                                        Vui lòng nhập họ tên có ít nhất 2 ký tự.
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="register-email"
                                        class="form-label">Email</label>
                                    <!-- type="email" giúp kiểm tra định dạng email cơ bản. -->
                                    <input
                                        type="email"
                                        id="register-email"
                                        name="email"
                                        class="form-control"
                                        placeholder="em@example.com"
                                        autocomplete="email"
                                        aria-describedby="register-email-error"
                                        required>
                                    <div id="register-email-error"
                                        class="invalid-feedback">
                                        Vui lòng nhập email hợp lệ.
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="register-password"
                                        class="form-label">
                                        Mật khẩu
                                    </label>
                                    <!-- minlength="8" là điều kiện minh họa cho bài tập.
                     Đăng ký thật cần được kiểm tra thêm ở backend. -->
                                    <input
                                        type="password"
                                        id="register-password"
                                        name="password"
                                        class="form-control"
                                        autocomplete="new-password"
                                        minlength="8"
                                        aria-describedby="password-help register-password-error"
                                        required>
                                    <div id="password-help" class="form-text">
                                        Sử dụng ít nhất 8 ký tự.
                                    </div>
                                    <div id="register-password-error"
                                        class="invalid-feedback">
                                        Vui lòng nhập mật khẩu có ít nhất 8 ký
                                        tự.
                                    </div>
                                </div>

                                <!-- Bước 3: Nút submit gửi yêu cầu kiểm tra form. -->
                                <button type="submit"
                                    class="btn btn-primary w-100">
                                    Đăng ký
                                </button>

                                <!-- Hiển thị kết quả kiểm tra, không hiển thị mật khẩu. -->
                                <p id="register-status" class="small mt-3 mb-0"
                                    role="status"></p>
                            </form>

                            <!-- Bước 4: Link quay lại trang đăng nhập. -->
                            <p class="text-center mt-4 mb-0">
                                Đã có tài khoản?
                                <a href="login.html">Đăng nhập</a>
                            </p>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="text-center text-secondary py-3">
            <small>&copy; Web Basic — Thực hiện bởi: Tên của em</small>
        </footer>

        <!-- Bootstrap Bundle đã bao gồm Popper. -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="assets/js/main.js"></script>

        <!-- Bước 5: Kiểm tra điều kiện HTML rồi hiện phản hồi Bootstrap. -->
        <script>
    const registerForm = document.getElementById("register-form");
    const registerStatus = document.getElementById("register-status");

    registerForm.addEventListener("submit", function (event) {
      // Bản mẫu chỉ kiểm tra dữ liệu, chưa gửi tới máy chủ.
      event.preventDefault();
      registerForm.classList.add("was-validated");

      if (!registerForm.checkValidity()) {
        registerStatus.textContent =
          "Em hãy kiểm tra các trường được đánh dấu.";
        registerForm.querySelector(":invalid").focus();
        return;
      }

      registerStatus.textContent =
        "Dữ liệu đúng định dạng. Bản mẫu chưa tạo tài khoản.";

      // TODO: Khóa học sau sẽ kết nối API đăng ký tại đây.
      // Không lưu mật khẩu trong localStorage hoặc in ra console.
    });
  </script>
    </body>
</html>
